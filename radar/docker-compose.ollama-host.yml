# Optional: reach host Ollama from radar-worker (Profilo F Local-Hybrid).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ollama-host.yml up -d radar-worker
#
# Prereq: Ollama running on the host (e.g. 127.0.0.1:11434) with the model pulled
# (default ops: gemma4:12b). Set LLM_SIMPLE_* in .env to PROVIDER=openai and
# BASE_URL=http://host.docker.internal:11434/v1 — see .env.example Profilo F.
#
# Do NOT combine with a containerized ollama/ollama:rocm on the same GPU.
# Do NOT publish host :11434 on LAN by default.
services:
  radar-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
