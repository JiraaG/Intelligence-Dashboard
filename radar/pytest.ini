[pytest]
asyncio_mode = auto
testpaths = backend/app/tests
pythonpath = backend
norecursedirs = scripts diagnostics .git .venv venv node_modules data
markers =
    unit: Fast isolated unit tests without external services
    integration: Integration tests with mocks or local services
    live: Live tests against real external services (require RUN_LIVE_TESTS=1)
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
