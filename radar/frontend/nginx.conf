server {
    listen 80;
    server_name localhost;

    # Root della build Angular
    root /usr/share/nginx/html;
    index index.html;

    # ─── Compressione Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;

    # ─── SPA Routing (Angular client-side routes) ────────────────────────────
    # Qualsiasi route che non corrisponde a un file fisico viene servita come index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Proxy API al Backend ────────────────────────────────────────────────
    # Evita problemi CORS in produzione: il browser chiama /api/, Nginx fa proxy a radar-backend
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://radar-backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── Cache Assets Statici ────────────────────────────────────────────────
    # JS/CSS Angular vengono serviti con hash nel nome → cache aggressiva è sicura
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # GeoJSON locale: cache moderata (potrebbe essere aggiornato)
    location /assets/data/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # ─── index.html: nessuna cache (aggiornamenti app immediati) ────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ─── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Healthcheck endpoint per Docker ─────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
