server {
    listen 8080;
    server_name localhost;

    # Root della build Angular
    root /usr/share/nginx/html;
    index index.html;

    # Limit request bodies (API writes stay small; uploads not expected)
    client_max_body_size 1m;

    # ─── Compressione Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;

    # ─── Security Headers ────────────────────────────────────────────────────
    # X-XSS-Protection intentionally omitted (obsolete / can enable XSS auditor bugs).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Angular SPA + local assets; Carto dark tiles; Google Fonts CSS + font files.
    # script-src keeps 'unsafe-inline' for Angular runtime bootstrap; tighten in later phases if feasible.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; connect-src 'self' https://*.basemaps.cartocdn.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ─── SPA Routing (Angular client-side routes) ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Proxy API al Backend ────────────────────────────────────────────────
    # Browser chiama /api/; Nginx fa proxy a radar-backend (stessa origine → no CORS).
    # Resolver dinamico obbligatorio con variabile in proxy_pass (evita 502 post-restart).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://radar-backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # ─── Cache Assets Statici ────────────────────────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # GeoJSON locale: cache moderata (potrebbe essere aggiornato)
    location /assets/data/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── index.html: nessuna cache (aggiornamenti app immediati) ────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; connect-src 'self' https://*.basemaps.cartocdn.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # ─── Healthcheck endpoint per Docker ─────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
