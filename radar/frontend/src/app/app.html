<!-- Toolbar centrata -->
<app-radar-toolbar
  [countries]="state.countries()"
  [savedCountries]="state.savedCountries()"
  [articleCount]="articleCount()"
  [readCount]="readCount()"
  [savedCount]="savedCount()"
  [isLoading]="state.isLoading()"
  [apiError]="!!state.error()"
  (filtersChange)="onFiltersChange($event)"
  (countrySelected)="onToolbarCountrySelect($event)"
  (savedCountrySelected)="onToolbarSavedCountrySelect($event)">
</app-radar-toolbar>

<!-- Mappa Leaflet -->
<div class="map-container" [class.split-active]="isMapSplit()">
  <app-radar-map
    [articles]="state.detailArticles()"
    [countries]="state.countries()"
    [mapSummary]="state.filteredSummary()"
    [mapRelations]="state.filteredMapRelations()"
    [focusCountryCode]="focusCountryCode()"
    (markerClicked)="onMarkerClick($event)"
    (clusterClicked)="onClusterClick($event)"
    (countryClicked)="onCountryClick($event)"
    (relationClicked)="onRelationClick($event)">
  </app-radar-map>
</div>

<!-- Sidebar Split-Screen -->
<app-radar-sidebar
  [article]="selectedArticle()"
  [clusterArticles]="clusterArticles()"
  [isOpen]="isSidebarOpen()"
  (closed)="closeSidebar()"
  (categoryClicked)="onSidebarCategoryClick($event)"
  (activeArticleChanged)="onActiveArticleChanged($event)">
</app-radar-sidebar>
