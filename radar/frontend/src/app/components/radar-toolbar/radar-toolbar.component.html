<div class="radar-toolbar">
  <div class="brand-group">
    <span class="brand-icon">📡</span>
    <span class="brand-title">RADAR</span>
  </div>

  <div class="divider"></div>

  <!-- Calendario PrimeNG -->
  <p-calendar
    [(ngModel)]="selectedDate"
    (onSelect)="onFiltersChange()"
    [maxDate]="today"
    dateFormat="yy-mm-dd"
    [showIcon]="true"
    placeholder="Seleziona Data">
  </p-calendar>

  <!-- Sentiment MultiSelect -->
  <p-multiSelect
    [options]="sentimentOptions"
    [(ngModel)]="selectedSentiment"
    (onChange)="onFiltersChange()"
    optionLabel="label"
    optionValue="value"
    placeholder="Sentiment"
    [maxSelectedLabels]="1"
    selectedItemsLabel="{0} selezionati">
  </p-multiSelect>

  <!-- Tipologia MultiSelect -->
  <p-multiSelect
    [options]="categoryOptions"
    [(ngModel)]="selectedCategories"
    (onChange)="onFiltersChange()"
    optionLabel="label"
    optionValue="value"
    placeholder="Tipologia"
    [maxSelectedLabels]="1"
    selectedItemsLabel="{0} selezionate">
  </p-multiSelect>

  <div class="divider"></div>

  <div class="article-count-container"
       (mouseenter)="isTooltipHovered.set(true)"
       (mouseleave)="isTooltipHovered.set(false)">
    <button
      type="button"
      class="article-count"
      (click)="toggleTooltip($event)"
      [attr.aria-expanded]="isTooltipVisible()"
      aria-haspopup="true">
      NOTIZIE LETTE/TROVATE: <strong>{{ readCount() }}/{{ articleCount() }}</strong>
    </button>

    <!-- Hover/Click countries tooltip -->
    <div class="countries-tooltip" *ngIf="isTooltipVisible() && countriesList().length > 0" role="listbox">
      <div class="tooltip-header">
        <span class="tooltip-title">Nazioni Coinvolte</span>
        <button type="button" class="tooltip-close-btn" (click)="closeTooltip($event)" aria-label="Chiudi">✕</button>
      </div>
      <div class="tooltip-list">
        <button
          type="button"
          class="tooltip-row clickable"
          *ngFor="let c of countriesList()"
          (click)="selectCountry(c.code, $event)"
          role="option">
          <span class="country-flag">{{ getFlagEmoji(c.code) }}</span>
          <span class="country-name">{{ c.name }}</span>
          <span class="country-badge">{{ c.readCount }}/{{ c.count }}</span>
        </button>
      </div>
    </div>
  </div>

  @if (apiError()) {
    <div class="api-error-banner" role="alert">
      Errore API — dati non disponibili
    </div>
  }

  <!-- Progress Bar per stato caricamento asincrono -->
  <div class="loader-wrapper" *ngIf="isLoading()">
    <p-progressBar mode="indeterminate" styleClass="radar-progress-bar"></p-progressBar>
  </div>
</div>
