<div class="radar-map-canvas-container">
  <div
    #mapHost
    id="radar-map-maplibre"
    class="radar-map-canvas"
    [class.blur-active]="isParsingGeoJson() && !mapUnavailable()"
    [class.is-hidden]="mapUnavailable()"
  ></div>

  @if (mapUnavailable()) {
    <div class="map-unavailable" role="alert">
      <h2>Mappa non disponibile</h2>
      <p>MapLibre non è stato inizializzato. Ricarica la pagina o verifica WebGL.</p>
    </div>
  } @else {
    <div
      class="map-legend-wrap"
      *ngIf="!isParsingGeoJson()"
      (mouseenter)="isLegendHovered.set(true)"
      (mouseleave)="isLegendHovered.set(false)"
    >
      <!-- Popover Espandibile -->
      <div
        class="legend-popover"
        *ngIf="isLegendVisible()"
        (click)="$event.stopPropagation()"
      >
        <div class="legend-popover-header">
          <span class="legend-popover-title">CLASSIFICAZIONE GEOPOLITICA</span>
          <button
            type="button"
            class="legend-popover-close"
            (click)="closeLegend()"
            aria-label="Chiudi legenda"
          >
            ✕
          </button>
        </div>
        <div class="legend-grid">
          <div class="legend-item" *ngFor="let item of legendItems">
            <span
              class="legend-color-dot"
              [ngStyle]="{
                'background-color': 'var(' + item.cssVar + ')',
                'box-shadow': '0 0 8px var(' + item.cssVar + ')',
              }"
            ></span>
            <span class="legend-icon">{{ item.icon }}</span>
            <span class="legend-label">{{ item.label }}</span>
          </div>
        </div>
      </div>

      <!-- Pulsante Trigger -->
      <button
        type="button"
        class="legend-trigger-btn"
        [class.is-active]="isLegendClicked()"
        [class.is-open]="isLegendVisible()"
        (click)="toggleLegendClick($event)"
        aria-label="Legenda Categorie"
      >
        <span class="legend-trigger-icon">🏷️</span>
        <span class="legend-trigger-text">LEGENDA CATEGORIE</span>
        <span class="legend-trigger-badge">15</span>
        <span class="legend-trigger-chevron">{{ isLegendVisible() ? '▼' : '▲' }}</span>
      </button>
    </div>

    <div class="bootstrapping-overlay" *ngIf="isParsingGeoJson()">
      <div class="loader-content">
        <span class="loader-icon">📡</span>
        <h2>INIZIALIZZAZIONE RADAR</h2>
        <p>Caricamento e ottimizzazione dei confini vettoriali...</p>
        <div class="loader-bar">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
  }
</div>
