# Phase 6 Block D — minimal green CI (no Docker-in-CI).
# Working roots: radar/frontend (Node), radar/ (pytest).
name: CI

on:
  push:
    branches:
      - main
      - refactor/enterprise-consolidation
  pull_request:
    branches:
      - main
      - refactor/enterprise-consolidation

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (verify-geojson / typecheck / test:ci / build:ci)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: radar/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify GeoJSON (fetch if missing + SHA pin)
        run: npm run verify-geojson:fetch

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (CI)
        run: npm run test:ci

      - name: Production build
        # build:ci also runs verify --fetch; asset already present from prior step
        run: npm run build:ci

  backend:
    name: Backend (pytest not live)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            radar/backend/app/requirements.txt
            radar/backend/app/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r backend/app/requirements-dev.txt

      - name: Pytest (exclude live)
        env:
          PYTHONPATH: backend
        # Includes test_migrations.py (discover + checksum) via default suite.
        run: python -m pytest -m "not live" -q

  secret-scan:
    name: Secret scan (best-effort)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grep for common API key shapes
        run: |
          set -euo pipefail
          pattern='AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}'
          matches="$(git grep -nE "$pattern" -- . || true)"
          if [ -n "$matches" ]; then
            echo "::error::Possible secret pattern found in tracked files:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no AIza… / sk-… key-shaped matches in tracked files."
